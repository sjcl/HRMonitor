services:
  timescaledb:
    image: timescale/timescaledb:2.29.2-pg18
    environment:
      - POSTGRES_USER=hrmonitor
      - POSTGRES_PASSWORD=hrmonitor
      - POSTGRES_DB=hrmonitor
    volumes:
      - ts-data-pg18:/var/lib/postgresql
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrmonitor -d hrmonitor"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # Redis now holds refresh sessions as well as the latest-BPM cache, so it is
  # no longer purely disposable: losing it logs every user out. AOF with
  # per-second fsync keeps sessions across restarts and redeploys, at the cost
  # of at most ~1s of writes.
  redis:
    image: redis:8.10.1-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  nats:
    image: nats:2.14.6-alpine
    expose:
      - "4222"
    restart: unless-stopped

  migration:
    build:
      context: ./backend
      dockerfile: migration/Dockerfile
    environment:
      - DATABASE_URL=postgres://hrmonitor:hrmonitor@timescaledb:5432/hrmonitor
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: api-backend/Dockerfile
    environment:
      - DATABASE_URL=postgres://hrmonitor:hrmonitor@timescaledb:5432/hrmonitor
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats:4222
      - RUST_LOG=api_backend=info
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:?PUBLIC_ORIGIN must be set}
      # Ed25519 signing key. Only this service holds the private half.
      - JWT_ISSUER=${JWT_ISSUER:?JWT_ISSUER must be set}
      - JWT_AUDIENCE=${JWT_AUDIENCE:?JWT_AUDIENCE must be set}
      - JWT_ACTIVE_KID=${JWT_ACTIVE_KID:?JWT_ACTIVE_KID must be set}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY must be set}
      - JWT_PUBLIC_KEYS=${JWT_PUBLIC_KEYS:?JWT_PUBLIC_KEYS must be set}
      # Never rotate on a live deployment: every refresh session is keyed by it.
      - REFRESH_TOKEN_HMAC_KEY=${REFRESH_TOKEN_HMAC_KEY:?REFRESH_TOKEN_HMAC_KEY must be set}
      - REFRESH_SEAL_KEY=${REFRESH_SEAL_KEY:?REFRESH_SEAL_KEY must be set}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID must be set}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:?DISCORD_CLIENT_SECRET must be set}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI:?DISCORD_REDIRECT_URI must be set}
      - PULSOID_CLIENT_ID=${PULSOID_CLIENT_ID}
      - PULSOID_CLIENT_SECRET=${PULSOID_CLIENT_SECRET}
      - PULSOID_REDIRECT_URI=${PULSOID_REDIRECT_URI}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY}
    expose:
      - "3001"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_started
      nats:
        condition: service_started
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3001/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  ws-gateway:
    build:
      context: ./backend
      dockerfile: ws-gateway/Dockerfile
    environment:
      - DATABASE_URL=postgres://hrmonitor:hrmonitor@timescaledb:5432/hrmonitor
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats:4222
      - RUST_LOG=ws_gateway=info
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:?PUBLIC_ORIGIN must be set}
      # Public keys only: ws-gateway is built without common's `jwt-issue`
      # feature, so it has no code that can read a private key.
      - JWT_ISSUER=${JWT_ISSUER:?JWT_ISSUER must be set}
      - JWT_AUDIENCE=${JWT_AUDIENCE:?JWT_AUDIENCE must be set}
      - JWT_PUBLIC_KEYS=${JWT_PUBLIC_KEYS:?JWT_PUBLIC_KEYS must be set}
    expose:
      - "3002"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_started
      nats:
        condition: service_started
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3002/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  pulsoid-ingest:
    build:
      context: ./backend
      dockerfile: pulsoid-ingest/Dockerfile
    environment:
      - DATABASE_URL=postgres://hrmonitor:hrmonitor@timescaledb:5432/hrmonitor
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats:4222
      - RUST_LOG=pulsoid_ingest=info
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_started
      nats:
        condition: service_started
      migration:
        condition: service_completed_successfully
    restart: unless-stopped

  # Proactive Pulsoid OAuth token refresher. Run as a single instance;
  # cross-process safety is guaranteed by a Postgres advisory lock inside
  # the service (see backend/pulsoid-refresher/src/refresh.rs) so a brief
  # double-start during redeploys is safe.
  pulsoid-refresher:
    build:
      context: ./backend
      dockerfile: pulsoid-refresher/Dockerfile
    environment:
      - DATABASE_URL=postgres://hrmonitor:hrmonitor@timescaledb:5432/hrmonitor
      - NATS_URL=nats://nats:4222
      - RUST_LOG=pulsoid_refresher=info
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY}
      - PULSOID_CLIENT_ID=${PULSOID_CLIENT_ID}
      - PULSOID_CLIENT_SECRET=${PULSOID_CLIENT_SECRET}
    depends_on:
      timescaledb:
        condition: service_healthy
      nats:
        condition: service_started
      migration:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 45s

  # Builds the SPA and serves it, and is the only public entry point.
  # Deliberately not gated on `service_healthy` for its upstreams: the edge
  # should come up regardless and absorb brief backend outages itself (see the
  # 503 + Retry-After handling for /api/ws/).
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    expose:
      - "80"
    depends_on:
      - backend
      - ws-gateway
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    restart: unless-stopped
    profiles:
      - prod

volumes:
  ts-data-pg18:
  redis-data:
