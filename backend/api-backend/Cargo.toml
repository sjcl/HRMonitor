[package]
name = "api-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../common", features = [
    "oauth",
    "signal",
    "web",
    "jwt-issue",
    "redis-conn",
] }
axum = "0.8.8"
tokio = { version = "1.51.1", features = ["full"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.23.0", features = ["v4"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
async-nats = "0.49.0"
chrono = "0.4.44"
chrono-tz = "0.10"
reqwest = { version = "0.13.2", features = ["json", "form"] }
aes-gcm = "0.10.3"
base64 = "0.23.0"
rand = "0.10.0"
urlencoding = "2.1.3"
sha2 = "0.11.0"
hex = "0.4.3"
redis = { version = "1.5", features = ["tokio-comp", "aio", "connection-manager"] }
url = "2.5"
# HMAC-SHA256 for refresh-token hashing. The stable `hmac` release is built on
# digest 0.10, so it needs the matching sha2 0.10 rather than the 0.11 used
# above for invite-token hashing. sha2 0.10 is already in the dependency graph
# transitively, so this pins an existing build rather than adding one; the
# alternative was hmac 0.13.0-rc, which is not something to run on an auth path.
hmac = "0.12"
sha2_hmac = { package = "sha2", version = "0.10" }

[dev-dependencies]
rand = "0.10"
