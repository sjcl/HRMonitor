[package]
name = "common"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
aes-gcm = "0.10.3"
base64 = "0.23.0"
rand = "0.10.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
tracing = "0.1.44"
tokio = { version = "1.51.1", features = ["signal", "macros", "rt"], optional = true }
futures-util = { version = "0.3.32", optional = true }
tokio-util = { version = "0.7.18", optional = true }
reqwest = { version = "0.13.2", features = ["json", "form"], optional = true }
urlencoding = { version = "2.1.3", optional = true }
axum = { version = "0.8.8", optional = true }
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"], optional = true }
ed25519-dalek = { version = "2.2.0", optional = true }
url = { version = "2.5.8", optional = true }
redis = { version = "1.5.0", features = [
    "tokio-comp",
    "aio",
    "connection-manager",
], optional = true }

[features]
oauth = ["dep:reqwest", "dep:urlencoding"]

# Shared Redis connection construction (`redis_conn`). Enabled by every service
# that talks to Redis; keeps the reconnect/timeout contract defined once.
redis-conn = ["dep:redis"]
signal = ["dep:tokio", "dep:futures-util", "dep:tokio-util"]
# `web` implies `jwt`: request authentication *is* JWT verification now.
web = ["dep:axum", "dep:url", "jwt"]

# Access-token verification only. Enabled by every service that authenticates
# requests (api-backend, ws-gateway).
jwt = ["dep:jsonwebtoken"]

# Access-token *issuing*. Deliberately separate from `jwt` so that `JwtSigner`
# and every line of code that reads `JWT_PRIVATE_KEY` is not even compiled into
# binaries that only need to verify (ws-gateway). This is a compile-time
# guarantee, not a convention.
jwt-issue = ["jwt", "dep:ed25519-dalek"]
