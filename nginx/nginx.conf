worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Preserve X-Forwarded-Proto from upstream proxy (cloudflared).
    # Falls back to $scheme for local development without a TLS-terminating proxy.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    upstream backend {
        server backend:3001;
    }

    upstream ws_gateway {
        server ws-gateway:3002;
    }

    server {
        listen 80;
        root /usr/share/nginx/html;

        # Baseline for responses that do not declare an add_header of their own.
        # Locations that do must include this file again — see the comment in
        # security-headers.conf.
        include /etc/nginx/security-headers.conf;

        # nginx's own liveness. Deliberately not /healthz, which is proxied to
        # the backend and therefore reports the backend's health, not ours.
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        # Authentication -> backend. Previously routed to the Next.js app; the
        # Rust API now owns Discord OAuth, session issuing, refresh and logout.
        location /api/auth/ {
            proxy_pass http://backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            # Credentials. Never store these anywhere, at any layer. The Rust
            # handlers set this too; repeating it here is defence in depth.
            add_header Cache-Control "no-store" always;
            include /etc/nginx/security-headers.conf;
        }

        # WebSocket -> ws-gateway
        location /api/ws/ {
            proxy_pass http://ws_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 2s;

            # Replace raw 502/504 from a brief ws-gateway outage with
            # 503 + Retry-After so the client backoff in
            # frontend/src/lib/ws.ts engages instead of surfacing a
            # hard proxy error to Cloudflare.
            proxy_intercept_errors on;
            error_page 502 504 = @ws_unavailable;
        }

        location @ws_unavailable {
            add_header Retry-After 2 always;
            include /etc/nginx/security-headers.conf;
            return 503;
        }

        # HTTP API -> backend.
        #
        # A distinct location, so the SPA fallback below can never apply here:
        # an unknown /api/... path must 404 from the API, not quietly return
        # index.html with a 200 and leave the client parsing HTML as JSON.
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Health check -> backend (public, no auth)
        location = /healthz {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Vite emits content-hashed filenames here, so these are immutable.
        location /assets/ {
            expires 365d;
            add_header Cache-Control "public, immutable" always;
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }

        # SPA fallback. index.html itself must revalidate every time: it names
        # the hashed bundles, so a cached copy would keep pointing at assets
        # that no longer exist after a deploy.
        location / {
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/security-headers.conf;
            try_files $uri /index.html;
        }
    }
}
