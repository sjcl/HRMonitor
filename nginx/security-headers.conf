# Security headers, kept in a snippet on purpose.
#
# nginx does NOT merge `add_header` across levels: as soon as a `location`
# declares one header of its own, it stops inheriting every `add_header` from
# the enclosing `server` block. Several locations here set their own
# `Cache-Control`, so putting these at `server` level alone would silently drop
# them from exactly the responses that matter most — the HTML document and the
# JavaScript bundle.
#
# Including this file everywhere an `add_header` appears sidesteps that rule
# entirely (an `include` is a plain textual insertion). The alternative,
# `add_header_inherit merge;`, needs nginx >= 1.29.3 and would tie us to a
# specific tag of `nginx:alpine`.
#
# `always` so the headers are present on error responses too.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Belt-and-braces alongside `frame-ancestors` for older browsers.
add_header X-Frame-Options "DENY" always;

# img-src: Discord's CDN serves the avatars stored in accounts.provider_image.
# style-src 'unsafe-inline': Recharts applies inline styles to the SVG it
#   renders. Worth revisiting if that changes.
# connect-src: same-origin XHR plus the same-origin WebSocket, which CSP treats
#   as a separate scheme.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.discordapp.com; font-src 'self'; connect-src 'self' ws: wss:" always;
